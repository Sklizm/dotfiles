gui:
  theme:
    activeBorderColor:
      - "#a7c080"
      - bold
    inactiveBorderColor:
      - "#859289"
    optionsTextColor:
      - "#7fbbb3"
    selectedLineBgColor:
      - "#3d484d"
    selectedRangeBgColor:
      - "#3d484d"
    cherryPickedCommitBgColor:
      - "#475258"
    cherryPickedCommitFgColor:
      - "#a7c080"
    unstagedChangesColor:
      - "#e67e80"
    defaultFgColor:
      - "#d3c6aa"
  showFileTree: true
  showRandomTip: false
  showBottomLine: false
  nerdFontsVersion: "3"
  border: rounded
git:
  paging:
    colorArg: always
    pager: delta --paging=never --syntax-theme=ansi
  commit:
    signOff: false
