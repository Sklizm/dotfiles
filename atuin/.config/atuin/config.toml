## Atuin config — everforest, local-only history
auto_sync = false
update_check = false
sync_address = ""

dialect = "uk"
style = "compact"
inline_height = 14

show_preview = true
show_help = true

exit_mode = "return-original"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"

search_mode = "fuzzy"
keymap_mode = "auto"
ctrl_n_shortcuts = false

history_filter = [
   "^secret-cmd",
   "^innocuous-cmd .*--secret=.+",
]

cwd_filter = [
   "^/very/secret/area",
]

[stats]
common_subcommands = ["cargo", "go", "git", "npm", "yarn", "pnpm", "dnf", "flatpak", "kwriteconfig6"]
common_prefix = ["sudo"]
ignored_commands = ["cd", "ls", "ll", "la"]
