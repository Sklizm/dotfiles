# ───────────────────────────────────────────────────────────────────
# Kitty config — everforest dark medium, parity with old Alacritty
# ───────────────────────────────────────────────────────────────────

# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11
disable_ligatures never
modify_font cell_height 100%

# Cursor
cursor_shape         block
cursor_blink_interval 0

# Window
remember_window_size  no
initial_window_width  120c
initial_window_height 32c
window_padding_width  12
hide_window_decorations no
confirm_os_window_close 0
background_opacity 0.95
background_blur 0
dynamic_background_opacity yes

# Scrollback
scrollback_lines 20000
scrollback_pager_history_size 100

# Mouse
url_color #7fbbb3
url_style curly
copy_on_select clipboard
strip_trailing_spaces smart

# Tab bar (only visible when more than 1 tab)
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_foreground   #2d353b
active_tab_background   #a7c080
active_tab_font_style   bold
inactive_tab_foreground #859289
inactive_tab_background #3d484d
inactive_tab_font_style normal
tab_title_template "{index}: {title}"

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Performance
repaint_delay 8
input_delay 1
sync_to_monitor yes

# Shell integration (provides command tracking and better Ctrl+arrow nav)
shell_integration enabled

# ───────────────────────────────────────────────────────────────────
# Everforest Dark Medium palette
# ───────────────────────────────────────────────────────────────────

foreground       #d3c6aa
background       #2d353b
selection_foreground #d3c6aa
selection_background #475258

cursor           #d3c6aa
cursor_text_color #2d353b

# Black
color0  #475258
color8  #7a8478
# Red
color1  #e67e80
color9  #e67e80
# Green
color2  #a7c080
color10 #a7c080
# Yellow
color3  #dbbc7f
color11 #dbbc7f
# Blue
color4  #7fbbb3
color12 #7fbbb3
# Magenta
color5  #d699b6
color13 #d699b6
# Cyan
color6  #83c092
color14 #83c092
# White
color7  #d3c6aa
color15 #d3c6aa

# ───────────────────────────────────────────────────────────────────
# Key bindings
# ───────────────────────────────────────────────────────────────────

# Shift+Enter sends ESC+CR (vim-compatible, matches old Alacritty bind)
map shift+enter send_text all \x1b\x0d

# Standard copy/paste (kitty defaults are Ctrl+Shift+C/V but add classic too)
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# Font size
map ctrl+equal     change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0

# Tabs
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab

# Splits (kitty calls them windows)
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+\\ launch --location=hsplit
map ctrl+shift+- launch --location=vsplit
