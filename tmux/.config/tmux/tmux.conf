set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:Tc,xterm-256color:Tc"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes in current dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- Everforest theme ----
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#2d353b,fg=#d3c6aa"

set -g status-left-length 60
set -g status-left "#[bg=#a7c080,fg=#2d353b,bold] #S #[bg=#2d353b,fg=#a7c080]"

set -g status-right-length 100
set -g status-right "#[fg=#475258]#[fg=#d3c6aa,bg=#475258] %H:%M #[fg=#a7c080,bg=#475258]#[bg=#a7c080,fg=#2d353b,bold] %d-%b "

setw -g window-status-format "#[fg=#859289,bg=#2d353b]  #I:#W  "
setw -g window-status-current-format "#[fg=#2d353b,bg=#83c092]#[fg=#2d353b,bg=#83c092,bold] #I:#W #[fg=#83c092,bg=#2d353b]"

set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#a7c080"

set -g message-style "bg=#dbbc7f,fg=#2d353b,bold"
set -g message-command-style "bg=#dbbc7f,fg=#2d353b"

set -g mode-style "bg=#3d484d,fg=#dbbc7f"
