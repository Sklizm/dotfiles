palette = "everforest"
format = """
[░▒▓](crust)\
$os\
[](bg:lavender fg:crust)\
$directory\
[ ](fg:lavender bg:surface0)\
$git_branch\
$git_status\
$hg_branch\
[ ](fg:surface0 bg:crust)\
[▓▒░](crust)\
[ ◦•](surface2)\
$fill\
[•◦ ](surface2)\
[░▒▓](crust)\
[ ](fg:surface0 bg:crust)\
$status\
$cmd_duration\
[ ](fg:crust bg:surface0)\
$battery\
[▓▒░](crust)
[·](surface0)\
[·](surface2)\
[•](overlay1)\
[ ](teal)\
"""

[fill]
symbol = "·"
style = "surface2"

[directory]
style = "fg:surface0 bg:lavender"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = "  "
"Applications" = "  "
"Desktop" = "  "
"Developer" = "  "
"Documents" = " 󰈙 "
"Downloads" = "  "
"Games" = "  "
"GitHub" = "  "
"Library" = "  "
"Movies" = "  "
"Music" = "  "
"Pictures" = "  "
"Projects" = "  "
"Public" = "  "
"Screenshots" = " 󱣴 "
"Videos" = "  "
"Thunderbird" = "   "
"source" = " 󰈹 "
"comm" = "  "


[git_branch]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:lavender bg:surface0)]($style)'

[git_status]
style = "bg:surface0"
format = '[[($all_status$ahead_behind )](fg:lavender bg:surface0)]($style)'

[hg_branch]
disabled = false
symbol = ""
style = "bg:surface0"
format = '[[ $symbol $branch ](fg:lavender bg:surface0)]($style)'

[cmd_duration]
disabled = false
min_time = 0
show_milliseconds = true
style = "fg:text bg:surface0"
format = '[$duration]($style)'

[status]
symbol = '  '
success_symbol = '  '
not_executable_symbol = '  '
not_found_symbol = '  '
map_symbol = true
disabled = false
style = 'fg:text bg:surface0'
format = '[$symbol]($style)'


[battery]
disabled = false
full_symbol = ''
charging_symbol = '⚡️'
discharging_symbol = ''
unknown_symbol = ''
empty_symbol = ''
format = '[[ $symbol $percentage ](fg:text bg:crust)]($style)'

[[battery.display]]
threshold = 25
discharging_symbol = ''
style = 'fg:yellow bg:crust'

[[battery.display]]
threshold = 10
discharging_symbol = ''
style = 'fg:peach bg:crust'

[[battery.display]]
threshold = 5
discharging_symbol = ''
style = 'bold fg:red bg:crust'

[os]
format = '[ $symbol]($style)'
style = 'fg:lavender bg:crust'
disabled = false

[os.symbols]
Arch = " "
Debian = " "
Fedora = " "
FreeBSD = " "
Linux = " "
Macos = " "
NixOS = "󱄅 "
Nobara = " "
Pop = " "
Raspbian = " "
Ubuntu = " "
Unknown = " "

# Everforest Dark — Medium
# Palette key names are preserved from the prior catppuccin config
# so the format string didn't need to change. The hex values are everforest.
[palettes.everforest]
crust    = "#2d353b"  # bg0
surface0 = "#3d484d"  # bg2
surface2 = "#7a8478"  # grey0
overlay1 = "#859289"  # grey1
text     = "#d3c6aa"  # fg
lavender = "#a7c080"  # green   ← primary accent
teal     = "#83c092"  # aqua
yellow   = "#dbbc7f"
peach    = "#e69875"  # orange
red      = "#e67e80"
