## mpv config — sane defaults + everforest OSD
profile=high-quality
hwdec=auto-safe
vo=gpu-next
gpu-api=auto

gapless-audio=yes
keep-open=yes
save-position-on-quit=yes
sub-auto=fuzzy
prefetch-playlist=yes
cache=yes
cache-secs=60

## OSD — uosc draws its own; keep mpv's built-in minimal
osd-bar=no
border=no
osd-color='#d3c6aa'
osd-back-color='#2d353b'
osd-border-color='#2d353b'
osd-font='JetBrainsMono Nerd Font'
osd-font-size=24
osd-shadow-offset=0
osd-shadow-color='#00000000'

## Subtitles — everforest cream on dark outline
sub-font='JetBrainsMono Nerd Font'
sub-font-size=42
sub-color='#d3c6aa'
sub-border-color='#2d353b'
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color='#00000080'

## Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template='mpv-%F-%P'
